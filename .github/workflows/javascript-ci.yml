name: OmniNet JavaScript CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package.json
            adapters/package-lock.json

      - name: Install root dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi

      - name: Install adapter dependencies
        run: |
          if [ -f adapters/package-lock.json ]; then npm ci --prefix adapters; elif [ -f adapters/package.json ]; then npm install --prefix adapters; fi

      - name: Run adapter tests
        run: npm test --prefix adapters

      - name: Lint when a root ESLint configuration exists
        run: |
          if [ -f eslint.config.js ] || [ -f eslint.config.mjs ] || [ -f .eslintrc ] || [ -f .eslintrc.js ] || [ -f .eslintrc.json ]; then
            npm run lint
          else
            echo 'No root ESLint configuration detected; lint skipped.'
          fi

      - name: Build when a root build script exists
        run: npm run build --if-present
